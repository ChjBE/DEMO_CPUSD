<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CPU Scheduling Simulator</title>
    <style>
        :root {
            --bg: #f4f7fc;
            --sf: #fff;
            --tx: #0f1e3d;
            --mu: #5f6c85;
            --ac: #2563eb;
            --bt: #2563eb;
            --bd: #e2e8f3;
            --ac2: #eaf1ff;
            --nv: rgba(255, 255, 255, .88);
            --ok: #15803d;
            --okbg: #e6f6ec;
            --hi: #c2570c;
            --er: #c42b1c;
            --sh: 0 1px 2px rgba(15, 30, 61, .04), 0 4px 14px rgba(15, 30, 61, .04);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0b1220;
                --sf: #131c2e;
                --tx: #e6ecf8;
                --mu: #94a3bf;
                --ac: #6aa1ff;
                --bd: #243049;
                --ac2: #172a4d;
                --nv: rgba(19, 28, 46, .88);
                --ok: #4ade80;
                --okbg: #12301f;
                --hi: #fb923c;
                --er: #f87171;
                --sh: 0 1px 2px rgba(0, 0, 0, .3);
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #0b1220;
            --sf: #131c2e;
            --tx: #e6ecf8;
            --mu: #94a3bf;
            --ac: #6aa1ff;
            --bd: #243049;
            --ac2: #172a4d;
            --nv: rgba(19, 28, 46, .88);
            --ok: #4ade80;
            --okbg: #12301f;
            --hi: #fb923c;
            --er: #f87171;
            --sh: 0 1px 2px rgba(0, 0, 0, .3);
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.6 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        }

        /* ---------- Icon ---------- */
        .i {
            display: block;
            flex: none
        }

        .bd {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--ac2);
            color: var(--ac);
            margin: 0 auto 12px
        }

        .bd.g {
            background: var(--okbg);
            color: var(--ok)
        }

        /* ---------- Nav ---------- */
        .nav {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 50;
            display: flex;
            gap: 2px;
            align-items: center;
            height: 64px;
            padding: 0 clamp(16px, 4vw, 48px);
            background: var(--nv);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--bd);
            overflow-x: auto;
            scrollbar-width: none
        }

        .nav::-webkit-scrollbar {
            display: none
        }

        .lg {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 28px;
            color: var(--ac);
            white-space: nowrap
        }

        .nav b {
            color: var(--tx);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.01em
        }

        .nav button {
            position: relative;
            display: flex;
            align-items: center;
            height: 64px;
            border: 0;
            background: none;
            color: var(--tx);
            padding: 0 14px;
            font: inherit;
            font-size: 14.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: color .15s
        }

        .nav button:hover {
            color: var(--ac)
        }

        .nav button.on {
            color: var(--ac);
            font-weight: 600
        }

        .nav button.on::after {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: var(--ac)
        }

        /* ---------- Layout ---------- */
        .pg {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 20px 48px
        }

        h1 {
            font-size: 30px;
            margin: 0 0 8px;
            letter-spacing: -.02em;
            line-height: 1.2
        }

        h2 {
            font-size: 19px;
            margin: 32px 0 14px;
            letter-spacing: -.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3 {
            margin: 0 0 8px;
            font-size: 16px
        }

        .mu {
            color: var(--mu)
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--sh)
        }

        .card p {
            margin: 0 0 10px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px
        }

        .fc {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px 20px 22px
        }

        .fc h3 {
            margin: 2px 0 6px;
            font-size: 16px
        }

        .fc p {
            flex: 1;
            max-width: 22ch;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 16px
        }

        /* ---------- Algorithm Cards Grid (Đồng đều, không xê dịch) ---------- */
        .alg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
            align-items: stretch;
        }

        .card.alg-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .card.alg-card:hover {
            box-shadow: 0 6px 20px rgba(15, 30, 61, .08);
        }

        .alg-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--bd);
        }

        .alg-head h3 {
            margin: 0 0 4px;
            font-size: 17px;
            color: var(--tx);
            font-weight: 700;
        }

        .alg-mode {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--mu);
        }

        .alg-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            background: var(--ac2);
            color: var(--ac);
            white-space: nowrap;
        }

        .alg-body {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
        }

        .alg-desc {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--tx);
            margin: 0 0 14px;
            flex: 0 0 auto;
        }

        .alg-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            flex: 1 1 auto;
        }

        .alg-box {
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            line-height: 1.5;
            background: var(--bg);
            border: 1px solid var(--bd);
        }

        .alg-box.ok-box {
            border-left: 3.5px solid var(--ok);
        }

        .alg-box.over-box {
            border-left: 3.5px solid var(--hi);
        }

        .alg-box b {
            display: inline-block;
            margin-right: 4px;
        }

        .alg-footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--bd);
        }

        .alg-footer .bt {
            width: 100%;
        }

        /* ---------- Buttons & fields ---------- */
        .bt,
        button.bt {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--bt);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 9px 18px;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: filter .15s, background .15s
        }

        .bt:hover {
            filter: brightness(1.08)
        }

        .bt.g {
            background: var(--ac2);
            color: var(--ac)
        }

        .bt.sm {
            padding: 6px 14px;
            font-size: 13px
        }

        .bt.x {
            padding: 6px 8px
        }

        .bt:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }

        input,
        select,
        textarea {
            font: inherit;
            background: var(--sf);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 7px 10px;
            max-width: 100%
        }

        table input {
            width: 64px
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 14px 0
        }

        .sc {
            overflow-x: auto;
            scrollbar-width: thin
        }

        /* ---------- Table ---------- */
        table {
            border-collapse: collapse;
            width: 100%;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 12px;
            overflow: hidden
        }

        th,
        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--bd);
            text-align: left;
            white-space: nowrap
        }

        th {
            background: var(--ac2);
            font-weight: 600;
            font-size: 13.5px;
            color: var(--tx)
        }

        tr:last-child td {
            border-bottom: 0
        }

        tr.tr-active {
            background: var(--ac2) !important;
            font-weight: 600
        }

        td.bst {
            color: var(--ok);
            font-weight: 700
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fff
        }

        .tag.new { background: #7c8aa5; }
        .tag.ready { background: #2563eb; }
        .tag.running { background: #16a34a; }
        .tag.waiting { background: #d97706; }
        .tag.terminated { background: #64748b; }
        .tag.r { background: #2563eb; }
        .tag.t { background: #64748b; }

        /* ---------- KPI ---------- */
        .kpi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 16px 0
        }

        .kpi>div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 20px 14px;
            color: var(--mu);
            box-shadow: var(--sh)
        }

        .kpi b {
            display: block;
            font-size: 26px;
            line-height: 1.2;
            color: var(--tx);
            margin-bottom: 2px;
            letter-spacing: -.01em
        }

        .kpi b.ok {
            color: var(--ok)
        }

        .kpi b.hi {
            color: var(--hi)
        }

        .kpi b.over {
            color: var(--er)
        }

        .ok {
            color: var(--ok)
        }

        .hi {
            color: var(--hi)
        }

        .over {
            color: var(--er)
        }

        /* ---------- Hero ---------- */
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr);
            align-items: center;
            gap: 24px;
            padding: 44px 48px;
            border-radius: 18px;
            color: #fff;
            background: radial-gradient(60% 110% at 88% 70%, rgba(59, 110, 240, .55), transparent 70%), linear-gradient(135deg, #0d2a63, #1a4cc0);
            margin-bottom: 20px
        }

        .ey {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .08em;
            color: #8fb4ff;
            margin-bottom: 8px
        }

        .hero h1 {
            font-size: clamp(30px, 4vw, 44px);
            white-space: nowrap;
            margin: 0 0 14px;
            letter-spacing: -.025em
        }

        .hero p {
            max-width: 52ch;
            margin: 0 0 26px;
            font-size: 16.5px;
            line-height: 1.6;
            color: #dbe6ff
        }

        .hero .hb {
            background: #3b6ef0;
            padding: 13px 24px;
            font-size: 15.5px;
            border-radius: 10px
        }

        .hv {
            display: grid;
            place-items: center
        }

        .hv svg {
            width: 100%;
            height: auto;
            max-width: 480px
        }

        /* ---------- Virtual desktop ---------- */
        .dk {
            position: relative;
            height: 520px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--bd);
            background: radial-gradient(55% 70% at 70% 30%, rgba(96, 165, 250, .55), transparent 70%), radial-gradient(45% 60% at 20% 90%, rgba(37, 99, 235, .6), transparent 70%), linear-gradient(135deg, #0d2a63, #1d4ed8 65%, #3b82f6);
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 16px 16px 72px;
            box-shadow: var(--sh)
        }

        .ic {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 92px;
            background: none;
            border: 0;
            color: #fff;
            font: inherit;
            font-size: 12.5px;
            line-height: 1.25;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
            cursor: pointer;
            border-radius: 10px;
            padding: 8px 4px
        }

        .ic:hover {
            background: rgba(255, 255, 255, .16)
        }

        .ic:active {
            background: rgba(255, 255, 255, .26)
        }

        .ic .tile {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .18);
            border: 1px solid rgba(255, 255, 255, .28);
            backdrop-filter: blur(6px);
            color: #fff;
            text-shadow: none
        }

        .tk {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 52px;
            background: rgba(244, 247, 252, .86);
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 14px;
            color: #0f1e3d;
            border-top: 1px solid rgba(255, 255, 255, .6);
            z-index: 9999
        }

        .st {
            display: grid;
            grid-template-columns: 9px 9px;
            gap: 2px;
            margin: 0 4px 0 0
        }

        .st i {
            width: 9px;
            height: 9px;
            background: #2563eb;
            display: block;
            border-radius: 1px
        }

        .se {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .8);
            border: 1px solid rgba(15, 30, 61, .12);
            border-radius: 999px;
            padding: 5px 16px;
            font-size: 13px;
            min-width: 160px;
            color: #5f6c85
        }

        #tbi {
            display: flex;
            gap: 6px
        }

        #tbi span {
            position: relative;
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .7);
            color: #2563eb
        }

        #tbi span::after {
            content: "";
            position: absolute;
            bottom: 2px;
            width: 12px;
            height: 3px;
            border-radius: 3px;
            background: #2563eb
        }

        .cl {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            text-align: right;
            line-height: 1.3
        }

        .win {
            position: absolute;
            width: 300px;
            max-width: 80%;
            background: var(--sf);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(5, 15, 45, .35)
        }

        .wh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px 6px 14px;
            cursor: move;
            background: var(--ac2);
            border-radius: 12px 12px 0 0;
            touch-action: none;
            font-size: 13.5px;
            font-weight: 600
        }

        .wt {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ac)
        }

        .wt::after {
            content: attr(data-t);
            color: var(--tx)
        }

        .wh button {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border: 0;
            background: none;
            color: var(--tx);
            cursor: pointer;
            border-radius: 6px
        }

        .wh button:hover {
            background: #e81123;
            color: #fff
        }

        .wb {
            padding: 12px 14px 14px;
            font-size: 13.5px
        }

        .wb p {
            margin: 0 0 10px
        }

        .wb textarea {
            width: 100%;
            height: 70px
        }

        /* ---------- Gantt & Timeline ---------- */
        input[type=range] {
            width: min(320px, 60%);
            padding: 0;
            vertical-align: middle;
            accent-color: var(--ac)
        }

        input[type=checkbox] {
            accent-color: var(--ac)
        }

        .gt-wrap {
            position: relative;
            margin-bottom: 8px;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 16px 14px 8px;
        }

        .gt-scroll {
            overflow-x: auto;
            scrollbar-width: thin;
            padding-bottom: 4px;
            position: relative;
        }

        .gt-inner {
            position: relative;
            padding-top: 10px;
        }

        .gt {
            position: relative;
            display: flex;
            gap: 2px;
            height: 48px;
            margin-bottom: 28px
        }

        .sg {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            min-width: 0;
            user-select: none;
            transition: opacity .15s, outline .15s, filter .15s;
        }

        .sg.idle {
            background: repeating-linear-gradient(45deg, var(--bd), var(--bd) 6px, rgba(0,0,0,0.03) 6px, rgba(0,0,0,0.03) 12px) !important;
            color: var(--mu) !important;
            border: 1px dashed var(--bd);
            font-weight: 500;
            font-size: 11px;
        }

        .sg.active {
            outline: 2.5px solid var(--ac);
            outline-offset: 1px;
            box-shadow: 0 0 12px rgba(37, 99, 235, .45);
            z-index: 2;
        }

        .sg.future {
            opacity: 0.38;
            filter: saturate(60%);
        }

        .sg.past {
            opacity: 1;
        }

        .sg small {
            position: absolute;
            bottom: -22px;
            left: 0;
            transform: translateX(-50%);
            color: var(--mu);
            font-size: 11px;
            font-weight: 500
        }

        .sg:first-child small {
            transform: none
        }

        .sg small.en {
            left: auto;
            right: 0;
            transform: translateX(50%)
        }

        /* Timeline axis ticks */
        .gt-axis {
            position: relative;
            height: 20px;
            border-top: 1px solid var(--bd);
            margin-top: -6px;
        }

        .gt-tick {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--mu);
            font-size: 10px;
            pointer-events: none;
        }

        .gt-tick::before {
            content: "";
            width: 1px;
            height: 4px;
            background: var(--mu);
            margin-bottom: 2px;
        }

        .gt-cur-line {
            position: absolute;
            top: 6px;
            bottom: 24px;
            width: 2px;
            background: #ef4444;
            z-index: 10;
            pointer-events: none;
            transition: left .08s ease-out;
        }

        .gt-cur-line::after {
            content: "▼";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #ef4444;
        }

        .lgd {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 8px;
            font-size: 12.5px;
            color: var(--mu)
        }

        .lgd span {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .lgd i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: block
        }

        .bt:disabled {
            opacity: .45;
            cursor: not-allowed;
            filter: none
        }

        /* ---------- Ready Queue ---------- */
        .rq-wrap {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 14px 0 20px;
            box-shadow: var(--sh);
        }

        .rq-lbl {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--tx);
            margin-right: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .rq-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--ac2);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12.5px;
        }

        .rq-item b {
            color: #fff;
            padding: 1px 7px;

                cause: 'SRTF và Priority Preemptive gây ra sự bất công bằng nghiêm trọng khi tải cao: một tiến trình có thể phải chờ gấp nhiều lần thời gian thực thi của chính nó.',
                rec: 'Round Robin hoặc MLFQ để bảo đảm tính công bằng (Fairness), giới hạn thời gian chờ tối đa (Max Waiting Time) và đảm bảo mọi tiến trình đều được cấp CPU.'
            }
        };
        const COL = ['#2563eb', '#0d9488', '#d97706', '#7c3aed', '#db2777', '#059669', '#dc2626', '#4f46e5', '#0891b2', '#ea580c'];
        const S = { view: 'home', procs: [], pid: 1, t0: Date.now(), algo: null, q: 3, pp: true, fin: false, z: 5, wn: 0, sc: 'starve', n: 12, load: null, r: null, cur: 0, tm: null };

        /* =========================================================================
           3. BỘ XỬ LÝ LẬP LỊCH CPU CHUẨN XÁC & TẠO ẢNH TRẠNG THÁI (SNAPSHOTS)
           - Giữ nguyên Arrival Time thật của tiến trình (KHÔNG trừ mn làm lệch mốc 0)
           - Xử lý đúng thời gian CPU rỗi (Idle)
           - Đảm bảo logic chuẩn của FCFS, SJF, SRTF, PRIO, RR, MLQ, MLFQ
           - Tạo snapshot trạng thái chi tiết tại từng đơn vị thời gian t
        ========================================================================= */
        function sim(P0, algo, q, pp) {
            if (!P0 || !P0.length) return null;
            q = Math.max(1, +q || 3);
            const P = P0.map((p, idx) => ({
                idx,
                pid: p.pid,
                name: p.name || ('P' + p.pid),
                type: p.type || 'HH',
                at: Math.max(0, +p.at || 0),
                cpu: Math.max(1, +p.cpu || 1),
                io: Math.max(0, +p.io || 0),
                pr: +p.pr || 0,
                rem: Math.max(1, +p.cpu || 1),
                lvl: 0,
                usedQ: 0,
                firstRun: null,
                ct: null,
                wt: 0
            }));
            const n = P.length;
            let t = 0, cur = null, lastPid = null;
            let cs = 0, busy = 0, done = 0;
            const gantt = [];
            const events = [];
            const snapshots = [];
            const Q = algo === 'MLQ' ? [[], []] : algo === 'MLFQ' ? [[], [], []] : [[]];

            function logEv(time, pid, from, to, reason) {
                events.push({ t: time, pid, from, to, reason });
            }

            function recordSnapshot(now) {
                const readyList = [];
                if (algo === 'MLQ') {
                    for (let l = 0; l < 2; l++) {
                        for (let p of Q[l]) readyList.push({ idx: p.idx, pid: p.pid, name: p.name, rem: p.rem, pr: p.pr, lvl: l });
                    }
                } else if (algo === 'MLFQ') {
                    for (let l = 0; l < 3; l++) {
                        for (let p of Q[l]) readyList.push({ idx: p.idx, pid: p.pid, name: p.name, rem: p.rem, pr: p.pr, lvl: l });
                    }
                } else {
                    for (let p of Q[0]) readyList.push({ idx: p.idx, pid: p.pid, name: p.name, rem: p.rem, pr: p.pr, lvl: 0 });
                }

                const procStats = P.map(p => {
                    let st = 'New';
                    if (p.ct !== null && p.ct <= now) st = 'Terminated';
                    else if (cur && cur.pid === p.pid) st = 'Running';
                    else if (p.at <= now) st = 'Ready';
                    return {
                        idx: p.idx,
                        pid: p.pid,
                        name: p.name,
                        type: p.type,
                        at: p.at,
                        cpu: p.cpu,
                        io: p.io,
                        pr: p.pr,
                        rem: p.rem,
                        lvl: p.lvl,
                        state: st,
                        wt: p.wt,
                        tat: (p.ct !== null && p.ct <= now) ? (p.ct - p.at) : (p.at <= now ? now - p.at : 0),
                        rt: p.firstRun !== null && p.firstRun <= now ? (p.firstRun - p.at) : null,
                        ct: p.ct !== null && p.ct <= now ? p.ct : null
                    };
                });

                snapshots.push({
                    t: now,
                    curRunningPid: cur ? cur.pid : -1,
                    readyList,
                    procStats,
                    busy,
                    cs,
                    done,
                    u: now > 0 ? (busy / now * 100) : 0,
                    thr: now > 0 ? (done / now) : 0,
                    eventsUpToT: events.slice()
                });
            }

            while (done < n && t < 10000) {
                // 1. Tiến trình đến tại thời điểm t
                const arriving = P.filter(p => p.at === t);
                for (let p of arriving) {
                    logEv(t, p.pid, 'New', 'Ready', 'Đến hệ thống, vào hàng đợi sẵn sàng');
                    if (algo === 'MLQ') {
                        p.lvl = (p.type === 'CPU') ? 1 : 0;
                        Q[p.lvl].push(p);
                    } else if (algo === 'MLFQ') {
                        p.lvl = 0;
                        p.usedQ = 0;
                        Q[0].push(p);
                    } else {
                        Q[0].push(p);
                    }
                }

                // 2. Kiểm tra hết Quantum hoặc Tiền đình (Preemption) của tiến trình đang chạy
                if (cur !== null) {
                    let qLimit = 1e9;
                    if (algo === 'RR') qLimit = q;
                    else if (algo === 'MLQ') qLimit = (cur.lvl === 0) ? q : 1e9;
                    else if (algo === 'MLFQ') qLimit = (cur.lvl === 0) ? q : (cur.lvl === 1) ? 2 * q : 1e9;

                    if (cur.usedQ >= qLimit) {
                        // Hết lượt Quantum
                        if (algo === 'MLFQ') {
                            cur.lvl = Math.min(2, cur.lvl + 1);
                            cur.usedQ = 0;
                            logEv(t, cur.pid, 'Running', 'Ready', 'Hết Quantum (' + qLimit + '), chuyển xuống Q' + cur.lvl);
                            Q[cur.lvl].push(cur);
                        } else if (algo === 'MLQ') {
                            cur.usedQ = 0;
                            logEv(t, cur.pid, 'Running', 'Ready', 'Hết Quantum, quay lại cuối Q' + cur.lvl);
                            Q[cur.lvl].push(cur);
                        } else if (algo === 'RR') {
                            cur.usedQ = 0;
                            logEv(t, cur.pid, 'Running', 'Ready', 'Hết Quantum (' + q + '), quay lại cuối hàng đợi');
                            Q[0].push(cur);
                        }
                        cur = null;
                    } else {
                        // Kiểm tra ngắt tiền đình (Preemption)
                        let preempt = false, reason = '';
                        if (algo === 'SRTF') {
                            let minP = null;
                            for (let p of Q[0]) {
                                if (!minP || p.rem < minP.rem || (p.rem === minP.rem && p.at < minP.at)) minP = p;
                            }
                            if (minP && minP.rem < cur.rem) {
                                preempt = true;
                                reason = 'Bị ngắt bởi P' + minP.pid + ' có thời gian còn lại ngắn hơn (' + minP.rem + ' < ' + cur.rem + ')';
                                Q[0].push(cur);
                            }
                        } else if (algo === 'PRIO' && pp) {
                            let minP = null;
                            for (let p of Q[0]) {
                                if (!minP || p.pr < minP.pr || (p.pr === minP.pr && p.at < minP.at)) minP = p;
                            }
                            if (minP && minP.pr < cur.pr) {
                                preempt = true;
                                reason = 'Bị ngắt bởi P' + minP.pid + ' có ưu tiên cao hơn (' + minP.pr + ' < ' + cur.pr + ')';
                                Q[0].push(cur);
                            }
                        } else if (algo === 'MLQ') {
                            if (cur.lvl === 1 && Q[0].length > 0) {
                                preempt = true;
                                reason = 'Bị ngắt bởi tiến trình ở hàng đợi Q0 ưu tiên hơn';
                                Q[1].unshift(cur);
                            }
                        } else if (algo === 'MLFQ') {
                            let hasHigher = false;
                            for (let l = 0; l < cur.lvl; l++) {
                                if (Q[l].length > 0) { hasHigher = true; break; }
                            }
                            if (hasHigher) {
                                preempt = true;
                                reason = 'Bị ngắt bởi tiến trình ở hàng đợi ưu tiên cao hơn';
                                Q[cur.lvl].unshift(cur);
                            }
                        }
                        if (preempt) {
                            logEv(t, cur.pid, 'Running', 'Ready', reason);
                            cur = null;
                        }
                    }
                }

                // 3. Chọn tiến trình tiếp theo nếu CPU đang trống
                if (cur === null) {
                    if (algo === 'SJF') {
                        if (Q[0].length > 0) {
                            let b = 0;
                            for (let i = 1; i < Q[0].length; i++) {
                                if (Q[0][i].cpu < Q[0][b].cpu || (Q[0][i].cpu === Q[0][b].cpu && Q[0][i].at < Q[0][b].at)) b = i;
                            }
                            cur = Q[0].splice(b, 1)[0];
                            cur.usedQ = 0;
                        }
                    } else if (algo === 'SRTF') {
                        if (Q[0].length > 0) {
                            let b = 0;
                            for (let i = 1; i < Q[0].length; i++) {
                                if (Q[0][i].rem < Q[0][b].rem || (Q[0][i].rem === Q[0][b].rem && Q[0][i].at < Q[0][b].at)) b = i;
                            }
                            cur = Q[0].splice(b, 1)[0];
                            cur.usedQ = 0;
                        }
                    } else if (algo === 'PRIO') {
                        if (Q[0].length > 0) {
                            let b = 0;
                            for (let i = 1; i < Q[0].length; i++) {
                                if (Q[0][i].pr < Q[0][b].pr || (Q[0][i].pr === Q[0][b].pr && Q[0][i].at < Q[0][b].at)) b = i;
                            }
                            cur = Q[0].splice(b, 1)[0];
                            cur.usedQ = 0;
                        }
                    } else if (algo === 'MLQ') {
                        if (Q[0].length > 0) {
                            cur = Q[0].shift();
                            cur.usedQ = 0;
                        } else if (Q[1].length > 0) {
                            cur = Q[1].shift();
                            cur.usedQ = 0;
                        }
                    } else if (algo === 'MLFQ') {
                        for (let l = 0; l < 3; l++) {
                            if (Q[l].length > 0) {
                                cur = Q[l].shift();
                                break;
                            }
                        }
                    } else {
                        // FCFS, RR
                        if (Q[0].length > 0) {
                            cur = Q[0].shift();
                            cur.usedQ = 0;
                        }
                    }

                    if (cur !== null) {
                        if (cur.firstRun === null) cur.firstRun = t;
                        if (lastPid !== null && lastPid !== cur.pid) cs++;
                        lastPid = cur.pid;
                        logEv(t, cur.pid, 'Ready', 'Running', 'Được cấp CPU thực thi');
                    }
                }

                // Ghi nhận snapshot tại thời điểm t
                recordSnapshot(t);

                // 4. Ghi nhận biểu đồ Gantt
                const pid = (cur !== null) ? cur.pid : -1;
                const lastG = gantt[gantt.length - 1];
                if (lastG && lastG.pid === pid && lastG.e === t) {
                    lastG.e++;
                } else {
                    gantt.push({ pid, s: t, e: t + 1 });
                }

                // 5. Thực thi 1 đơn vị thời gian [t, t+1)
                if (cur !== null) {
                    cur.rem--;
                    cur.usedQ++;
                    busy++;
                }

                // Tăng thời gian chờ cho các tiến trình đang trong Ready Queue
                for (let l = 0; l < Q.length; l++) {
                    for (let p of Q[l]) p.wt++;
                }

                // Kiểm tra hoàn thành
                if (cur !== null && cur.rem === 0) {
                    cur.ct = t + 1;
                    done++;
                    logEv(t + 1, cur.pid, 'Running', 'Terminated', 'Hoàn thành tiến trình');
                    cur = null;
                }

                t++;
            }

            // Ghi nhận snapshot cuối cùng tại t = T
            recordSnapshot(t);

            const T = t;
            const m = P.map(p => ({
                idx: p.idx,
                pid: p.pid,
                name: p.name,
                type: p.type,
                at: p.at,
                cpu: p.cpu,
                io: p.io,
                pr: p.pr,
                ct: p.ct,
                firstRun: p.firstRun, tat: p.ct - p.at,
                wt: p.ct - p.at - p.cpu,
                rt: p.firstRun - p.at
            }));
            const avg = k => m.reduce((s, x) => s + x[k], 0) / n;
            const mq = Math.max(...snapshots.map(s => s.readyList.length));
            return {
                g: gantt,
                m,
                P,
                T,
                wt: avg('wt'),
                tat: avg('tat'),
                rt: avg('rt'),
                thr: T > 0 ? (n / T) : 0,
                u: T > 0 ? (busy / T * 100) : 0,
                cs,
                mq,
                mw: Math.max(...m.map(x => x.wt)),
                snapshots,
                events
            };
        }

        const cmp = P => AL.map(a => ({ id: a[0], r: sim(P, a[0], S.q, S.pp) }));

        /* =========================================================================
           4. BẢNG SO SÁNH 7 THUẬT TOÁN
        ========================================================================= */
        function cmpT(rows) {
            if (!rows || !rows.length) return '';
            const f = (k, b) => Math[b == 'max' ? 'max' : 'min'](...rows.map(x => x.r[k])),
                c = (x, k, d, b) => `<td class="${x.r[k] == f(k, b) ? 'bst' : ''}">${x.r[k].toFixed(d)}`;
            return `<div class="sc"><table><tr><th>Thuật toán<th>TB chờ<th>TB quay vòng<th>TB phản hồi<th>Throughput<th>CPU %<th>Đổi ngữ cảnh<th>Chờ tối đa</tr>` +
                rows.map(x => `<tr><td><b>${NM[x.id]}</b>${c(x, 'wt', 2)}${c(x, 'tat', 2)}${c(x, 'rt', 2)}${c(x, 'thr', 3, 'max')}${c(x, 'u', 1, 'max')}${c(x, 'cs', 0)}${c(x, 'mw', 0)}</tr>`).join('') +
                `</table></div><p class="mu">Ô màu xanh đậm là giá trị tốt nhất theo từng chỉ số giữa 7 thuật toán.</p>`;
        }

        /* =========================================================================
           5. HIỂN THỊ BIỂU ĐỒ GANTT, TRỤC THỜI GIAN & CON TRỎ HIỆN TẠI
        ========================================================================= */
        function gantt(r, upto) {
            upto = (upto == null) ? r.T : Math.max(0, Math.min(r.T, upto));
            const minW = Math.min(Math.max(r.T * 26, 320), 2800);
            const curPercent = r.T > 0 ? (upto / r.T * 100) : 0;

            // Xây dựng mốc trên trục thời gian
            let step = 1;
            if (r.T > 80) step = 10;
            else if (r.T > 40) step = 5;
            else if (r.T > 20) step = 2;
            const ticks = [];
            for (let ti = 0; ti <= r.T; ti += step) ticks.push(ti);
            if (ticks[ticks.length - 1] !== r.T) ticks.push(r.T);

            const axisHtml = `<div class="gt-axis">` + ticks.map(ti => {
                const pos = (ti / r.T * 100);
                return `<span class="gt-tick" style="left:${pos}%">${ti}</span>`;
            }).join('') + `</div>`;

            // Khối tiến trình
            const blocksHtml = r.g.map((s, k, ar) => {
                const dur = s.e - s.s;
                const isIdle = s.pid < 0;
                let cls = 'sg' + (isIdle ? ' idle' : '');
                if (s.e <= upto) cls += ' past';
                else if (s.s <= upto && upto < s.e) cls += ' active';
                else cls += ' future';

                const bg = isIdle ? '' : `background:${COL[s.pid % 10]};`;
                const label = isIdle ? 'IDLE' : 'P' + s.pid;
                const title = isIdle ? `CPU rỗi: ${s.s}–${s.e}` : `P${s.pid}: ${s.s}–${s.e} (thời lượng: ${dur})`;
                return `<div class="${cls}" style="flex:${dur};${bg}" title="${title}">${label}<small>${s.s}</small>${k == ar.length - 1 ? `<small class="en">${s.e}</small>` : ''}</div>`;
            }).join('');

            // Chú giải màu sắc
            const uniquePids = [...new Set(r.g.filter(s => s.pid >= 0).map(s => s.pid))].sort((a,b)=>a-b);
            const legendHtml = `<div class="lgd">` +
                uniquePids.map(pid => `<span><i style="background:${COL[pid % 10]}"></i>P${pid}</span>`).join('') +
                `<span><i style="background:var(--bd);border:1px dashed var(--mu)"></i>CPU rỗi</span>` +
                `<span><i style="background:#ef4444"></i>Con trỏ thời điểm t = ${upto}</span>` +
                `</div>`;

            return `<div class="gt-wrap"><div class="gt-scroll"><div class="gt-inner" style="min-width:${minW}px">` +
                `<div class="gt-cur-line" style="left:${curPercent}%"></div>` +
                `<div class="gt">${blocksHtml}</div>` +
                axisHtml +
                `</div></div>${legendHtml}</div>`;
        }

        /* =========================================================================
           6. HÀNG ĐỢI SẴN SÀNG (READY QUEUE) TẠI THỜI ĐIỂM t
        ========================================================================= */
        function readyQueueView(snapshot) {
            if (!snapshot || !snapshot.readyList.length) {
                return `<div class="rq-wrap"><span class="rq-lbl">${svg('list', 16, 2)} Hàng đợi sẵn sàng:</span><span class="mu">Trống (Không có tiến trình nào đang chờ cấp CPU)</span></div>`;
            }
            const items = snapshot.readyList.map((p, idx) => {
                const bg = COL[p.pid % 10];
                const extra = (p.lvl != null && S.algo.startsWith('ML') ? ` | Q${p.lvl}` : '') + (p.pr != null ? ` | Ưu tiên ${p.pr}` : '');
                return `<span class="rq-item"><b style="background:${bg}">P${p.pid}</b> ${p.name} <span class="mu">(còn ${p.rem}s${extra})</span></span>`;
            }).join('<span class="rq-arr">→</span>');
            return `<div class="rq-wrap"><span class="rq-lbl">${svg('list', 16, 2)} Hàng đợi sẵn sàng (${snapshot.readyList.length}):</span>${items}</div>`;
        }

        /* =========================================================================
           7. SƠ ĐỒ TRẠNG THÁI TIẾN TRÌNH TẠI THỜI ĐIỂM t
        ========================================================================= */
        const STN = ['New', 'Ready', 'Running', 'Waiting/Blocked', 'Terminated'];
        const STC = ['#7c8aa5', '#2563eb', '#16a34a', '#d97706', '#64748b'];

        function stateView(r, t) {
            t = Math.max(0, Math.min(r.T, t));
            const snap = r.snapshots[t] || r.snapshots[r.snapshots.length - 1];
            const pStats = snap.procStats;
            const byState = k => pStats.filter(p => {
                if (k === 0) return p.state === 'New';
                if (k === 1) return p.state === 'Ready';
                if (k === 2) return p.state === 'Running';
                if (k === 3) return p.state === 'Waiting';
                if (k === 4) return p.state === 'Terminated';
                return false;
            });

            // Kích thước SVG
            const W = 103, G = 22, X = k => k * (W + G);
            const mx = Math.max(1, ...[0, 1, 2, 4].map(k => byState(k).length));
            const H = 40 + Math.ceil(mx / 3) * 24 + 8;
            const WY = H + 54, TH = WY + 56, WW = 190;
            const mid = (X(1) + W / 2 + X(2) + W / 2) / 2;
            const c1 = X(1) + W / 2, c2 = X(2) + W / 2;

            const recentEvents = snap.eventsUpToT.slice(-6).reverse();
            const lastEv = recentEvents[0];
            const hasAct = a => lastEv && lastEv.t === t;

            const ar = (id, d, dash) => `<path class="ar${dash ? ' dash' : ''}${hasAct(id) ? ' on' : ''}" d="${d}" marker-end="url(#${hasAct(id) ? 'mo' : 'mh'})"/>`;

            const node = (k, x, y, w, h, dash) => {
                const list = byState(k);
                const c = STC[k];
                const act = list.length > 0;
                return `<g><rect class="nd${dash ? ' dash' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" style="${act ? 'stroke:' + c : ''}"/>` +
                    (act ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${c}" fill-opacity=".08"/>` : '') +
                    `<circle cx="${x + 9}" cy="${y + 17}" r="3.5" fill="${c}"/><text x="${x + 17}" y="${y + 21}">${STN[k]}</text><text class="cn" x="${x + w - 7}" y="${y + 21}" style="${act ? 'fill:' + c : ''}">${list.length}</text>` +
                    (k === 3 ? `<text class="sub" x="${x + 17}" y="${y + 40}">Chưa áp dụng (mô hình lập lịch CPU thuần)</text>` : '') +
                    list.map((p, j) => {
                        const px = x + 8 + (j % 3) * 29;
                        const py = y + 34 + Math.floor(j / 3) * 24;
                        return `<g><title>P${p.pid} – ${p.name}: ${STN[k]}</title><rect x="${px}" y="${py}" width="26" height="20" rx="6" fill="${COL[p.pid % 10]}"/><text class="cp" x="${px + 13}" y="${py + 14.5}">P${p.pid}</text></g>`;
                    }).join('') + `</g>`;
            };

            return `<svg class="sd" viewBox="0 0 480 ${TH}" role="img" aria-label="Sơ đồ trạng thái tiến trình tại t = ${t}"><defs><marker id="mh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mh" d="M1 1L9 5L1 9z"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mo" d="M1 1L9 5L1 9z"/></marker></defs>` +
                ar('nr', `M${X(0) + W + 1} 22H${X(1) - 3}`) +
                ar('dp', `M${X(1) + W + 1} 16H${X(2) - 3}`) +
                ar('pe', `M${X(2) - 1} 34H${X(1) + W + 3}`) +
                ar('tm', `M${X(2) + W + 1} 22H${X(3) - 3}`) +
                ar('rw', `M${c2} ${H + 1}V${WY - 3}`, 1) +
                ar('wr', `M${c1} ${WY - 1}V${H + 3}`, 1) +
                node(0, X(0), 0, W, H) +
                node(1, X(1), 0, W, H) +
                node(2, X(2), 0, W, H) +
                node(4, X(3), 0, W, H) +
                node(3, mid - WW / 2, WY, WW, 52, 1) +
                `</svg>` +
                `<ul class="evl">${recentEvents.length ? recentEvents.map(e => `<li><span class="tm">t = ${e.t}</span><span class="pc" style="background:${COL[e.pid % 10]}">P${e.pid}</span><span class="st2" style="color:${STC[STN.indexOf(e.from)]||'#666'}">${e.from}</span>${svg('arrow', 14, 2)}<span class="st2" style="color:${STC[STN.indexOf(e.to)]||'#666'}">${e.to}</span><span class="mu">(${e.reason})</span></li>`).join('') : '<li class="mu">Chưa có sự kiện chuyển trạng thái.</li>'}</ul>` +
                `<p class="mu note">Waiting/Blocked được giữ trong sơ đồ cho đủ chuẩn 5 trạng thái của Hệ điều hành; I/O Burst hiện mang tính hiển thị mở rộng, mô hình lập lịch CPU tập trung vào quá trình thực thi trên CPU.</p>`;
        }

        /* =========================================================================
           8. BẢNG TIẾN TRÌNH & CHỈ SỐ ĐỒNG BỘ THEO THỜI ĐIỂM t
        ========================================================================= */
        function processTableHTML(r, t) {
            t = Math.max(0, Math.min(r.T, t));
            const snap = r.snapshots[t] || r.snapshots[r.snapshots.length - 1];
            return `<table><tr><th>PID<th>Tên tiến trình<th>Loại<th>Arrival<th>CPU Burst<th>Priority<th>Trạng thái (t)<th>CPU còn lại<th>Thời gian chờ (t)<th>Bắt đầu (RT)<th>Hoàn tất (CT)<th>Quay vòng (TAT)</tr>` +
                snap.procStats.map(p => {
                    const isRunning = p.state === 'Running';
                    const tagClass = 'tag ' + p.state.toLowerCase();
                    const rtStr = p.rt !== null ? p.rt : '--';
                    const ctStr = p.ct !== null ? p.ct : (p.state === 'Terminated' ? p.ct : '--');
                    const tatStr = (p.ct !== null || p.at <= t) ? p.tat : '--';
                    return `<tr class="${isRunning ? 'tr-active' : ''}">` +
                        `<td><b>P${p.pid}</b></td>` +
                        `<td>${p.name}</td>` +
                        `<td>${p.type}</td>` +
                        `<td>${p.at}</td>` +
                        `<td>${p.cpu}</td>` +
                        `<td>${p.pr}</td>` +
                        `<td><span class="${tagClass}">${p.state}</span></td>` +
                        `<td>${p.rem} / ${p.cpu}</td>` +
                        `<td>${p.wt}</td>` +
                        `<td>${rtStr}</td>` +
                        `<td>${ctStr}</td>` +
                        `<td>${tatStr}</td>` +
                        `</tr>`;
                }).join('') + `</table>`;
        }

        function kpiCardsHTML(r, t) {
            t = Math.max(0, Math.min(r.T, t));
            const snap = r.snapshots[t] || r.snapshots[r.snapshots.length - 1];
            return `<div><b>${r.wt.toFixed(2)}</b>TB thời gian chờ (khi xong)</div>` +
                `<div><b>${r.tat.toFixed(2)}</b>TB quay vòng (khi xong)</div>` +
                `<div><b>${r.rt.toFixed(2)}</b>TB phản hồi</div>` +
                `<div><b>${snap.u.toFixed(1)}%</b>CPU mô phỏng (tại t=${t})</div>` +
                `<div><b>${snap.thr.toFixed(3)}</b>Throughput (tại t=${t})</div>` +
                `<div><b>${snap.cs}</b>Đổi ngữ cảnh (tại t=${t})</div>`;
        }

        function simStat(r, t) {
            if (t >= r.T) return ['Hoàn tất: mọi tiến trình đã Terminated.', 0];
            if (t <= 0) return ['Sẵn sàng. Nhấn Chạy hoặc Bước kế để bắt đầu.', 0];
            const sl = r.g.find(s => s.s <= t - 1 && t - 1 < s.e);
            return sl && sl.pid >= 0 ? [`CPU đang xử lý P${sl.pid} trong khoảng [${t - 1}, ${t}).`, 1] : [`CPU rỗi (IDLE) trong khoảng [${t - 1}, ${t}).`, 0];
        }

        /* =========================================================================
           9. ĐIỀU KHIỂN MÔ PHỎNG & ĐỒNG BỘ GIAO DIỆN
        ========================================================================= */
        function getActiveSim() {
            if (S.view === 'load' && S.loadSim) return S.loadSim;
            return S.r;
        }

        function simBtn() {
            const r = getActiveSim();
            if (!$('#bRun') || !r) return;
            const curT = (S.view === 'load') ? S.loadCur : S.cur;
            $('#bRun').disabled = !!S.tm;
            $('#bStop').disabled = !S.tm;
            $('#bStep').disabled = !!S.tm || curT >= r.T;
        }

        function simView(t) {
            const r = getActiveSim();
            if (!r) return;
            t = Math.max(0, Math.min(r.T, t));
            if (S.view === 'load') S.loadCur = t;
            else S.cur = t;

            const o = $('#gg .gt-scroll');
            const sl = o ? o.scrollLeft : 0;

            if ($('#gg')) $('#gg').innerHTML = gantt(r, t);
            if ($('#rq')) $('#rq').innerHTML = readyQueueView(r.snapshots[t]);
            if ($('#sd')) $('#sd').innerHTML = stateView(r, t);
            if ($('#pt-sim')) $('#pt-sim').innerHTML = processTableHTML(r, t);
            if ($('#kpi-sim')) $('#kpi-sim').innerHTML = kpiCardsHTML(r, t);

            if ($('#tv')) $('#tv').textContent = t;
            if ($('#ts')) $('#ts').value = t;

            const [m, on] = simStat(r, t);
            const e = $('#ss');
            if (e) {
                e.className = 'ss' + (on ? ' on' : '');
                e.innerHTML = `<i></i>${m}`;
            }

            // Tự động cuộn mượt theo con trỏ Gantt
            const n = $('#gg .gt-scroll');
            if (n && r.T > 0) {
                const targetX = (n.scrollWidth - 20) * (t / r.T);
                if (targetX > sl + n.clientWidth - 50) {
                    n.scrollLeft = targetX - n.clientWidth + 80;
                } else if (targetX < sl) {
                    n.scrollLeft = Math.max(0, targetX - 40);
                }
            }
            simBtn();
        }

        function simStop() {
            if (S.tm) {
                clearInterval(S.tm);
                S.tm = null;
            }
            simBtn();
        }

        function simTick() {
            const r = getActiveSim();
            if (!r || (!$('#gg'))) return simStop();
            const curT = (S.view === 'load') ? S.loadCur : S.cur;
            simView(curT + 1);
            const nextT = (S.view === 'load') ? S.loadCur : S.cur;
            if (nextT >= r.T) simStop();
        }

        function simRun() {
            if (S.tm) return;
            const r = getActiveSim();
            if (!r) return;
            const curT = (S.view === 'load') ? S.loadCur : S.cur;
            if (curT >= r.T) simView(0);
            const spd = +($('#spd')?.value || 700);
            S.tm = setInterval(simTick, spd);
            simBtn();
        }

        function simStep() {
            simStop();
            const curT = (S.view === 'load') ? S.loadCur : S.cur;
            simView(curT + 1);
        }

        function simReset() {
            simStop();
            simView(0);
        }

        function simSpd() {
            if (S.tm) {
                simStop();
                simRun();
            }
        }

        function simUI(r, t) {
            const [m, on] = simStat(r, t);
            return `<div class="card ctl">` +
                `<div class="cb">` +
                `<button class="bt" id="bRun" onclick="simRun()">${svg('run', 16, 2)}Chạy</button>` +
                `<button class="bt g" id="bStop" onclick="simStop()" disabled>${svg('pause', 16, 2)}Dừng</button>` +
                `<button class="bt g" id="bStep" onclick="simStep()" disabled>${svg('step', 16, 2)}Bước kế</button>` +
                `<button class="bt g" onclick="simReset()">${svg('reset', 16, 2)}Đặt lại</button>` +
                `<label>Tốc độ <select id="spd" onchange="simSpd()"><option value="1200">Chậm</option><option value="700" selected>Vừa</option><option value="300">Nhanh</option></select></label>` +
                `</div>` +
                `<div class="tl"><input id="ts" type="range" min="0" max="${r.T}" value="${t}" aria-label="Thời điểm mô phỏng" oninput="simStop();simView(+this.value)"><span>t = <b id="tv">${t}</b> / ${r.T}</span></div>` +
                `<p id="ss" class="ss${on ? ' on' : ''}"><i></i>${m}</p>` +
                `</div>` +
                `<div class="sim">` +
                `<div class="card"><h3>Biểu đồ Gantt & Trục thời gian</h3><p class="mu">Mỗi khối thể hiện khoảng thời gian tiến trình được cấp CPU. Khối viền sáng là tiến trình đang chạy tại t=${t}.</p><div id="gg">${gantt(r, t)}</div></div>` +
                `<div id="rq">${readyQueueView(r.snapshots[t])}</div>` +
                `<div class="card"><h3>Sơ đồ trạng thái tiến trình</h3><p class="mu">Phân loại và hiển thị trực quan các tiến trình theo 5 trạng thái tại thời điểm t=${t}.</p><div id="sd">${stateView(r, t)}</div></div>` +
                `</div>`;
        }

        const ctrl = (pg) => `<select aria-label="Thuật toán" onchange="S.algo=this.value;go('${pg}',1)">${!S.algo ? '<option value="" disabled selected>-- Chọn thuật toán --</option>' : ''}${AL.map(a => `<option value="${a[0]}" ${a[0] == S.algo ? 'selected' : ''}>${NM[a[0]]}</option>`).join('')}</select> Time Quantum <input type="number" min="1" value="${S.q}" style="width:68px" onchange="S.q=Math.max(1,+this.value||1);go('${pg}',1)"> <label><input type="checkbox" ${S.pp ? 'checked' : ''} onchange="S.pp=this.checked;go('${pg}',1)"> Priority có ngắt</label>`;

        /* =========================================================================
           10. QUẢN LÝ TIẾN TRÌNH & DESKTOP
        ========================================================================= */
        const ni = (p, k) => `<input type="number" min="${k == 'cpu' ? 1 : 0}" value="${p[k]}" onchange="U(${p.pid},'${k}',this.value)">`;
        const U = (id, k, v) => {
            const p = S.procs.find(x => x.pid == id);
            if (p) p[k] = Math.max(k == 'cpu' ? 1 : 0, +v || 0);
            S.fin = false;
            tbl();
        };
        const del = id => {
            S.procs = S.procs.filter(p => p.pid != id);
            tbl();
        };

        function tbl() {
            if (!$('#pt')) return;
            $('#pt').innerHTML = `<table><tr><th>PID<th>Tên tiến trình<th>Loại<th>Arrival<th>CPU Burst<th>I/O Burst<th>Priority<th>Trạng thái<th>Xóa</tr>` +
                (S.procs.length ? S.procs.map(p => `<tr><td><b>P${p.pid}</b><td>${p.name}<td>${p.type}<td>${ni(p, 'at')}<td>${ni(p, 'cpu')}<td>${ni(p, 'io')}<td>${ni(p, 'pr')}<td><span class="tag ${S.fin ? 'terminated' : 'ready'}">${S.fin ? 'Terminated' : 'Ready'}</span><td><button class="bt g x" onclick="del(${p.pid})" aria-label="Xóa">${svg('x', 16)}</button></tr>`).join('') :
                `<tr><td colspan="9" class="mu" style="text-align:center;padding:24px">Chưa có tiến trình. Mở một ứng dụng trên máy tính ảo hoặc nhấn “Nạp tập mẫu” để bắt đầu.</td></tr>`) +
                `</table>`;
        }

        function sample() {
            S.procs = [];
            [[0, 5, 2], [1, 3, 1], [2, 8, 4], [3, 2, 3], [4, 4, 2]].forEach(([a, c, p], idx) => {
                S.procs.push({ pid: idx + 1, name: 'Tiến trình ' + (idx + 1), type: 'HH', at: a, cpu: c, io: 0, pr: p });
            });
            S.pid = 6;
            S.fin = false;
            tbl();
        }

        function addP(e) {
            e.preventDefault();
            const f = e.target.elements;
            S.procs.push({
                pid: S.pid++,
                name: f.nm.value || ('Tiến trình ' + S.pid),
                type: f.ty.value,
                at: +f.at.value || 0,
                cpu: Math.max(1, +f.cpu.value || 1),
                io: +f.io.value || 0,
                pr: +f.pr.value || 0
            });
            S.fin = false;
            tbl();
            return false;
        }

        function spawn(i) {
            const a = APPS[i], j = Math.floor(Math.random() * 3) - 1;
            const p = {
                pid: S.pid++,
                name: a[0],
                type: a[2],
                at: Math.floor((Date.now() - S.t0) / 3000),
                cpu: Math.max(1, a[3] + j),
                io: a[4],
                pr: a[5]
            };
            S.procs.push(p);
            S.fin = false;
            tbl();
            return p;
        }

        function tb() {
            $('#tbi').innerHTML = [...document.querySelectorAll('.win')].map(w => `<span>${ico(w.dataset.ic, 20)}</span>`).join('');
        }

        function openApp(i) {
            const a = APPS[i], p = spawn(i), w = document.createElement('div'), k = S.wn++ % 6;
            w.className = 'win';
            w.dataset.ic = a[1];
            w.style.left = (230 + k * 28) + 'px';
            w.style.top = (20 + k * 26) + 'px';
            w.style.zIndex = ++S.z;
            w.innerHTML = `<div class="wh"><span class="wt" data-t="${a[0]}">${ico(a[1], 18)}</span><button aria-label="Đóng">${svg('x', 14)}</button></div><div class="wb"><p>${a[6]}</p>${i == 5 ? '<textarea placeholder="Nhập văn bản..."></textarea>' : ''}<p class="mu">Đã tạo tiến trình <b>P${p.pid}</b>: CPU Burst ${p.cpu}, I/O Burst ${p.io}, Priority ${p.pr}.</p><button class="bt">Tạo thêm tiến trình</button></div>`;
            const h = w.querySelector('.wh');
            h.onpointerdown = e => {
                if (e.target.tagName == 'BUTTON') return;
                w.style.zIndex = ++S.z;
                const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
                h.setPointerCapture(e.pointerId);
                h.onpointermove = e => {
                    w.style.left = Math.max(0, e.clientX - dx) + 'px';
                    w.style.top = Math.max(0, e.clientY - dy) + 'px';
                };
                h.onpointerup = () => { h.onpointermove = null; };
            };
            w.onpointerdown = () => { w.style.zIndex = ++S.z; };
            h.querySelector('button').onclick = () => { w.remove(); tb(); };
            w.querySelector('.bt').onclick = () => {
                const q = spawn(i);
                w.querySelector('.mu').innerHTML += ` Thêm <b>P${q.pid}</b>.`;
            };
            $('#dk').appendChild(w);
            tb();
        }

        function clk() {
            const d = new Date();
            const el = $('#clk');
            if (el) el.innerHTML = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + '<br>' + d.toLocaleDateString('vi-VN');
        }

        /* =========================================================================
           11. KỊCH BẢN TẢI CPU & ÁP DỤNG THUẬT TOÁN ĐỀ XUẤT (Section 8)
        ========================================================================= */
        function mkLoad() {
            simStop();
            S.sc = $('#sc').value;
            S.n = Math.min(40, Math.max(5, +$('#nn').value || 12));
            const n = S.n, sc = S.sc, R = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), P = [];
            for (let i = 0; i < n; i++) {
                let at, cpu, type = 'HH', pr = R(1, 5);
                if (sc == 'burst') { at = R(0, 2); cpu = R(2, 8); }
                else if (sc == 'cpu') { at = R(0, Math.floor(n * 0.8)); cpu = R(10, 20); type = 'CPU'; }
                else if (sc == 'mixed') { at = R(0, n * 2); if (i % 2) { type = 'IO'; cpu = R(1, 4); } else { type = 'CPU'; cpu = R(8, 15); } }
                else if (sc == 'inter') { if (i == 0) { at = 0; cpu = 20; type = 'CPU'; pr = 4; } else { at = R(0, Math.round(n * 1.5)); cpu = R(1, 3); type = 'IO'; pr = R(1, 3); } }
                else if (sc == 'hiprio') { at = R(0, n * 2); if (i % 5 == 0) { pr = 5; cpu = R(5, 9); } else { pr = R(1, 2); cpu = R(3, 7); } }
                else { // starve
                    if (i == 0) { at = 0; cpu = 6; pr = 9; }
                    else { at = i * 2 - 1; cpu = R(3, 5); pr = 1; }
                }
                P.push({ pid: i + 1, name: 'Tác vụ ' + (i + 1), type, at, cpu, io: type == 'IO' ? R(1, 4) : 0, pr });
            }
            S.load = { P, sc, appliedAlgo: null };
            S.loadSim = sim(P, S.algo, S.q, S.pp);
            S.loadCur = S.loadSim.T;
            go('load', 1);
        }

        function applyAlgo(algoId) {
            if (!S.load) return;
            simStop();
            S.algo = algoId;
            S.load.appliedAlgo = algoId;
            // Đồng bộ tập tiến trình sang workspace chung
            S.procs = S.load.P.map(p => ({ ...p }));
            S.fin = false;
            // Tính toán lại ngay lập tức bằng thuật toán mới
            S.loadSim = sim(S.load.P, algoId, S.q, S.pp);
            S.r = S.loadSim;
            S.loadCur = S.loadSim.T;
            S.cur = S.r.T;
            go('load', 1);
        }

        /* =========================================================================
           12. CÁC TRANG NỘI DUNG (VIEWS)
        ========================================================================= */
        const V = {
            home() {
                const n = S.procs.length;
                const kp = (ic, v, l, g) => `<div><span class="bd ${g ? 'g' : ''}">${svg(ic, 24)}</span><b>${v}</b>${l}</div>`;
                const fc = c => `<div class="card fc"><span class="bd">${svg(c[0], 24)}</span><h3>${c[1]}</h3><p class="mu">${c[2]}</p><button class="bt g sm" onclick="go('${c[3]}')">Mở</button></div>`;
                return `<section class="pg"><div class="hero"><div class="hc"><span class="ey">CPU SCHEDULING SIMULATOR</span><h1>Mô phỏng lập lịch CPU</h1><p>Tạo các tiến trình, chọn thuật toán và quan sát cách CPU được phân bổ qua biểu đồ Gantt, hàng đợi sẵn sàng, sơ đồ trạng thái và các chỉ số hiệu suất chuẩn xác.</p><button class="bt hb" onclick="go('vm')">Vào máy tính ảo ${svg('arrow', 18, 2)}</button></div><div class="hv">${HERO_SVG}</div></div>
<div class="kpi">${kp('list', n, 'Tiến trình đã tạo')}${kp('clock', S.fin ? 0 : n, 'Đang chờ')}${kp('check', S.fin ? n : 0, 'Đã hoàn thành', 1)}${kp('nodes', (S.algo && NM[S.algo]) ? NM[S.algo] : '-', 'Thuật toán đang chọn')}</div>
<div class="grid">${[['monitor', 'Máy tính ảo', 'Mô phỏng ứng dụng, sinh tiến trình mô phỏng.', 'vm'], ['bars', 'Thuật toán', 'Nguyên lý, ưu và nhược điểm của 7 thuật toán.', 'alg'], ['gauge', 'Phân tích tải CPU', 'Tạo kịch bản quá tải, phân tích và áp dụng thuật toán tối ưu.', 'load'], ['chart', 'Kết quả', 'Gantt, chỉ số, sơ đồ trạng thái và so sánh 7 thuật toán.', 'res']].map(fc).join('')}</div></section>`;
            },

            alg() {
                const AL_TAGS = {
                    FCFS: { mode: 'Không ngắt (Non-preemptive)', badge: 'FCFS' },
                    SJF: { mode: 'Không ngắt (Non-preemptive)', badge: 'SJF' },
                    SRTF: { mode: 'Có ngắt (Preemptive)', badge: 'SRTF' },
                    PRIO: { mode: 'Hỗ trợ ngắt & không ngắt', badge: 'Priority' },
                    RR: { mode: 'Có ngắt (Time Quantum)', badge: 'Round Robin' },
                    MLQ: { mode: 'Đa cấp cố định (Multilevel)', badge: 'MLQ' },
                    MLFQ: { mode: 'Đa cấp phản hồi (Feedback)', badge: 'MLFQ' }
                };

                return `<section class="pg"><h1>Các thuật toán lập lịch</h1><p class="mu">Bấm “Chạy thuật toán này” để mô phỏng tập tiến trình hiện tại. Với Priority, số nhỏ nghĩa là ưu tiên cao.</p><div class="alg-grid">` +
                    AL.map(a => {
                        const meta = AL_TAGS[a[0]] || { mode: 'Tiêu chuẩn', badge: a[0] };
                        return `<div class="card alg-card">` +
                            `<div class="alg-head"><div><h3>${NM[a[0]]}</h3><span class="alg-mode">${meta.mode}</span></div><span class="alg-badge">${meta.badge}</span></div>` +
                            `<div class="alg-body">` +
                            `<p class="alg-desc">${a[1]}</p>` +
                            `<div class="alg-details">` +
                            `<div class="alg-box ok-box"><b class="ok">Ưu điểm:</b> ${a[2]}</div>` +
                            `<div class="alg-box over-box"><b class="hi">Hạn chế:</b> ${a[3]}</div>` +
                            `</div>` +
                            `</div>` +
                            `<div class="alg-footer"><button class="bt" onclick="S.algo='${a[0]}';go('res')">${svg('run', 15, 2)}Chạy thuật toán này</button></div>` +
                            `</div>`;
                    }).join('') +
                    `</div></section>`;
            },

            res() {
                if (!S.procs.length) {
                    return `<section class="pg"><h1>Kết quả mô phỏng</h1><p class="mu">Chưa có tiến trình để mô phỏng.</p><button class="bt" onclick="sample();go('res')">Nạp tập mẫu</button> <button class="bt g" onclick="go('vm')">Tạo trên máy tính ảo</button></section>`;
                }
                S.fin = true;
                simStop();
                if (!S.algo) S.algo = 'FCFS';
                const r = S.r = sim(S.procs, S.algo, S.q, S.pp);
                S.cur = r.T;
                const t = S.cur;

                return `<section class="pg"><h1>Kết quả mô phỏng: ${NM[S.algo]}</h1>` +

            load() {
                let h = `<section class="pg"><h1>Phân tích tải CPU</h1><p class="mu">Tạo kịch bản tải thực tế, hệ thống chạy tập tiến trình trên các thuật toán, phân tích nguyên nhân và đề xuất phương án tối ưu.</p>` +
                    `<div class="bar"><select id="sc" aria-label="Kịch bản">${SC.map(s => `<option value="${s[0]}" ${s[0] == S.sc ? 'selected' : ''}>${s[1]}</option>`).join('')}</select> Số tiến trình <input id="nn" type="number" min="5" max="40" value="${S.n}" style="width:72px"> <button class="bt" onclick="mkLoad()">${svg('run', 16, 2)}Tạo tải và phân tích</button></div>`;

                const L = S.load;

                const scInfo = SC_INFO[L.sc] || SC_INFO.burst;
                const rows = cmp(L.P);
                const r = rows.find(x => x.id == (S.algo || 'FCFS'))?.r || rows[0].r;
                S.loadSim = r;
                if (S.loadCur == null || S.loadCur > r.T) S.loadCur = r.T;
                const t = S.loadCur;

                const n = L.P.length;
                const ac = L.P.reduce((s, p) => s + p.cpu, 0) / n;
                const ratio = r.wt / ac;
                const st = ratio >= 4 && r.u > 88 ? ['Quá tải nghiêm trọng', 'over'] : ratio >= 1.5 ? ['Tải cao', 'hi'] : ['Bình thường', 'ok'];

                const d = [];
                d.push(`Hàng đợi sẵn sàng đạt tối đa ${r.mq} tiến trình. Thời gian chờ trung bình là ${r.wt.toFixed(1)}, gấp ${ratio.toFixed(1)} lần CPU Burst trung bình (${ac.toFixed(1)}).`);
                const sv = r.m.reduce((a, b) => b.wt > a.wt ? b : a);
                if (sv.wt >= 2.5 * r.wt && sv.wt - r.wt >= 4) {
                    d.push(`Phát hiện nguy cơ Starvation: Tác vụ P${sv.pid} (ưu tiên ${sv.pr}, burst ${sv.cpu}) phải chờ ${sv.wt} đơn vị thời gian (gấp ${(sv.wt / Math.max(r.wt, 0.1)).toFixed(1)} lần mức chờ trung bình).`);
                } else {
                    d.push('Thời gian chờ giữa các tiến trình tương đối đồng đều, chưa ghi nhận dấu hiệu bị bỏ đói nghiêm trọng.');
                }
                const io = r.m.filter(x => x.type == 'IO');
                if (io.length) {
                    const ir = io.reduce((s, x) => s + x.rt, 0) / io.length;
                    d.push(`Thời gian phản hồi trung bình của ${io.length} tác vụ tương tác là ${ir.toFixed(1)} đơn vị thời gian (${ir > 4 ? 'chậm, nên dùng thuật toán có chia lát thời gian như Round Robin hoặc MLFQ' : 'đạt mức tốt'}).`);

                // Bảng đề xuất thuật toán kèm NÚT ÁP DỤNG

                const recRows = [
                    ['Giảm thời gian chờ trung bình', 'wt', 'Chờ TB'],
                    ['Cải thiện tốc độ phản hồi', 'rt', 'Phản hồi TB'],

                    const b = best(metric);
                    const isApplied = S.algo === b.id;
                    return `<tr>` +
                        `<td><b>${NM[b.id]}</b></td>` +
                        `<td>${goal}</td>` +
                        `<td>${metricLabel} = ${b.r[metric].toFixed(1)} (tốt nhất trong 7 thuật toán)</td>` +
                        `<td>${LIM[b.id]}</td>` +
                        `<td><button class="bt sm ${isApplied ? 'g' : ''}" onclick="applyAlgo('${b.id}')">${isApplied ? '✓ Đang áp dụng' : 'Áp dụng'}</button></td>` +
                        `</tr>`;
                }).join('');

                const appliedBadge = L.appliedAlgo ?
                    `<div class="card" style="background:var(--okbg);border-color:var(--ok);color:var(--ok);margin-bottom:16px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between"><span><strong>✓ Đã áp dụng thuật toán: ${NM[L.appliedAlgo]}</strong> cho kịch bản này. Kết quả mô phỏng bên dưới đã được tính toán lại.</span><button class="bt sm" onclick="go('res')">Mở trang Kết quả đầy đủ →</button></div>` : '';

                // Bảng tập tiến trình kịch bản

                    L.P.map(p => `<tr><td><b>P${p.pid}</b></td><td>${p.name}</td><td>${p.type}</td><td>${p.at}</td><td>${p.cpu}</td><td>${p.pr}</td></tr>`).join('') +
                    `</table></div>`;

                return h +
                    `<div class="card" style="margin-bottom:16px">` +
                    `<h3>${scInfo.title}</h3>` +
                    `<p>${scInfo.desc}</p>` +
                    `<p><b class="hi">Nguyên nhân tải:</b> ${scInfo.cause}</p>` +
                    `<p><b class="ok">Định hướng giải quyết:</b> ${scInfo.rec}</p>` +
                    `</div>` +

                    `<div class="bar">Đang xem theo: ${ctrl('load')}</div>` +

                    `<div><b>${r.thr.toFixed(3)}</b>Throughput</div>` +
                    `<div><b class="${st[1]}">${st[0]}</b>Đánh giá tải</div>` +
                    `</div>` +
                    `<div class="card"><h3 style="margin-top:0">Nhận xét chuyên sâu từ kết quả mô phỏng</h3><ul>${d.map(x => `<li>${x}</li>`).join('')}</ul></div>` +
                    `<h2>Thuật toán đề xuất & Hành động</h2>` +
                    `<div class="sc"><table><tr><th>Thuật toán<th>Mục tiêu tối ưu<th>Căn cứ thực nghiệm<th>Đánh đổi cần lưu ý<th>Thao tác</tr>${recRows}</table></div>` +

                    `<label><span>Thuật toán quan tâm</span><select id="cf-algo"><option>Tất cả các thuật toán</option><option>FCFS</option><option>SJF / SRTF</option><option>Round Robin</option><option>Priority Scheduling</option><option>MLQ / MLFQ</option></select></label>` +
                    `</div>` +
                    `<label><span>Nội dung góp ý <b style="color:var(--er)">*</b></span><textarea id="cf-msg" rows="5" placeholder="Mô tả chi tiết câu hỏi, trường hợp cần kiểm tra hoặc ý tưởng cải tiến của bạn..." required></textarea></label>` +
                    `<button class="bt" type="submit" style="margin-top:6px">${svg('arrow', 16, 2)} Gửi phản hồi ngay</button>` +
                    `<div id="cf-alert" style="display:none;margin-top:14px;padding:12px 16px;border-radius:8px;font-size:13.5px"></div>` +
                    `</form>` +
                    `</div>` +
                    `</div>` +
                    `</div></section>`;
            }
        };

        function handleContactSubmit(e) {
            e.preventDefault();
            const alertEl = $('#cf-alert');
            const name = $('#cf-name') ? $('#cf-name').value : 'bạn';
            if (alertEl) {
                alertEl.style.display = 'block';
                alertEl.style.background = 'var(--okbg)';
                alertEl.style.color = 'var(--ok)';
                alertEl.style.border = '1px solid var(--ok)';
                alertEl.innerHTML = `<strong>✓ Cảm ơn ${name}!</strong> Góp ý của bạn đã được ghi nhận vào phiên làm việc hiện tại.`;
                setTimeout(() => {
                    if ($('#cf-msg')) $('#cf-msg').value = '';
                }, 1500);
            }
            return false;
        }

        /* =========================================================================
           13. ĐIỀU HƯỚNG VÀ KHỞI TẠO
        ========================================================================= */
        const TABS = [
            ['about', 'Giới thiệu'],
            ['home', 'Trang chủ'],
            ['vm', 'Máy tính ảo'],
            ['alg', 'Thuật toán'],
            ['load', 'Phân tích tải CPU'],
            ['res', 'Kết quả'],
            ['contact', 'Liên hệ']
        ];

        function go(v, preserveScroll) {
            S.view = v;
            const isVm = (v === 'vm');
            $('#vm').hidden = !isVm;
            $('#v').hidden = isVm;
            if (!isVm) {
                $('#v').innerHTML = V[v]();
                simBtn();
            } else {
                tbl();
            }
            $('#nav').innerHTML = `<span class="lg">${svg('chip', 30, 1.7)}<b>CPU Scheduling Simulator</b></span>` +
                TABS.map(t => `<button class="${t[0] == v ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
            if (!preserveScroll) scrollTo(0, 0);
        }

        // Khởi tạo giao diện Desktop VM
        $('#vm').innerHTML = `<section class="pg"><h1>Máy tính ảo</h1><p class="mu">Nhấp vào biểu tượng để mở ứng dụng; mỗi lần mở sẽ sinh một tiến trình mô phỏng tương ứng vào hệ thống. Bạn có thể kéo di chuyển cửa sổ bằng thanh tiêu đề.</p>` +
            `<div class="dk" id="dk">${APPS.map((a, i) => `<button class="ic" onclick="openApp(${i})"><span class="tile">${ico(a[1], 26)}</span>${a[0]}</button>`).join('')}` +
            `<div class="tk"><div class="st"><i></i><i></i><i></i><i></i></div><div class="se">${svg('search', 16)}<span>Tìm kiếm...</span></div><div id="tbi"></div><div class="cl" id="clk"></div></div></div>` +
            `<h2>Danh sách tiến trình</h2>` +
            `<form class="bar" onsubmit="return addP(event)">` +
            `<input name="nm" placeholder="Tên tiến trình">` +
            `<select name="ty"><option>CPU</option><option>IO</option><option selected>HH</option></select>` +
            `<input name="at" type="number" min="0" placeholder="Arrival" style="width:84px">` +
            `<input name="cpu" type="number" min="1" placeholder="CPU" style="width:70px">` +
            `<input name="io" type="number" min="0" placeholder="I/O" style="width:70px">` +
            `<input name="pr" type="number" min="0" placeholder="Priority" style="width:96px">` +
            `<button class="bt">Thêm tiến trình</button>` +
            `<button type="button" class="bt g" onclick="sample()">Nạp tập mẫu</button>` +
            `<button type="button" class="bt g" onclick="S.procs=[];S.fin=false;tbl()">Xóa tất cả</button>` +
            `</form>` +
            `<div class="sc" id="pt"></div>` +
            `<div class="bar"><button class="bt g" onclick="go('alg')">Chọn thuật toán</button><button class="bt" onclick="go('res')">Chạy mô phỏng</button></div>` +
            `<p class="mu">Loại tiến trình: CPU = CPU-bound (thiên về tính toán), IO = I/O-bound (thiên về nhập xuất), HH = hỗn hợp.</p></section>`;

        // Khởi động
        clk();
        setInterval(clk, 15000);
        // Khởi động với 0 tiến trình ban đầu theo yêu cầu
        go('home');
    </script>
</body>

</html>
